<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Caliper showing a selected button with its side panel and a distance measurement to a sibling button">
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="800" height="500" fill="#f7f7f8" rx="10"/>
  <rect x="0" y="0" width="800" height="34" fill="#e8e8ec" rx="10"/>
  <rect x="0" y="24" width="800" height="10" fill="#e8e8ec"/>
  <circle cx="18" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5.5" fill="#28c840"/>
  <rect x="80" y="9" width="180" height="16" rx="4" fill="#fff" stroke="#dadade" stroke-width="0.5"/>
  <text x="170" y="20" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#7a7a82" text-anchor="middle">caliper.dev</text>

  <!-- Page content area -->
  <text x="60" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1f" letter-spacing="-0.01em">Choose a plan</text>

  <!-- Card 1 (Starter) -->
  <rect x="60" y="84" width="180" height="244" fill="#ffffff" stroke="#e6e6ea" stroke-width="1" rx="10"/>
  <text x="80" y="116" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1f" letter-spacing="-0.01em">Starter</text>
  <text x="80" y="156" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1a1a1f" letter-spacing="-0.02em">$9</text>
  <text x="118" y="156" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#7a7a82">/ month</text>
  <text x="80" y="186" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7a7a82">Up to 3 projects</text>
  <text x="80" y="204" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7a7a82">Email support</text>

  <!-- Card 1 button (SELECTED) -->
  <rect x="80" y="276" width="140" height="36" fill="#0d99ff" rx="6"/>
  <text x="150" y="299" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="-0.005em">Get started</text>

  <!-- Selection outline (Caliper) -->
  <rect x="79" y="275" width="142" height="38" fill="none" stroke="#0d99ff" stroke-width="1" rx="6"/>
  <rect x="78" y="274" width="144" height="40" fill="none" stroke="rgba(13,153,255,0.22)" stroke-width="1" rx="6"/>
  <!-- Padding visualization (green tint inside) -->
  <rect x="80" y="276" width="140" height="8" fill="rgba(155,235,178,0.45)"/>
  <rect x="80" y="304" width="140" height="8" fill="rgba(155,235,178,0.45)"/>
  <!-- Dimension pill -->
  <g filter="url(#pillShadow)">
    <rect x="123" y="320" width="54" height="20" fill="#0d99ff" rx="4"/>
    <text x="150" y="334" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#fff" text-anchor="middle">140 × 36</text>
  </g>

  <!-- Card 2 (Pro) -->
  <rect x="280" y="84" width="180" height="244" fill="#ffffff" stroke="#e6e6ea" stroke-width="1" rx="10"/>
  <text x="300" y="116" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1f" letter-spacing="-0.01em">Pro</text>
  <text x="300" y="156" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1a1a1f" letter-spacing="-0.02em">$29</text>
  <text x="346" y="156" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#7a7a82">/ month</text>
  <text x="300" y="186" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7a7a82">Unlimited projects</text>
  <text x="300" y="204" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7a7a82">Priority support</text>

  <!-- Card 2 button (HOVERED — outline only) -->
  <rect x="300" y="276" width="140" height="36" fill="#fff" stroke="#0d99ff" stroke-width="1" rx="6"/>
  <text x="370" y="299" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d99ff" text-anchor="middle" letter-spacing="-0.005em">Try Pro</text>
  <!-- Hover outline + halo -->
  <rect x="299" y="275" width="142" height="38" fill="none" stroke="#0d99ff" stroke-width="1" rx="6"/>
  <rect x="298" y="274" width="144" height="40" fill="none" stroke="rgba(13,153,255,0.22)" stroke-width="1" rx="6"/>

  <!-- DISTANCE LINE between buttons (red) -->
  <line x1="221" y1="294" x2="299" y2="294" stroke="#ff4d4d" stroke-width="1"/>
  <line x1="221" y1="291" x2="221" y2="297" stroke="#ff4d4d" stroke-width="1"/>
  <line x1="299" y1="291" x2="299" y2="297" stroke="#ff4d4d" stroke-width="1"/>
  <g filter="url(#pillShadow)">
    <rect x="247" y="276" width="26" height="18" fill="#ff4d4d" rx="3"/>
    <text x="260" y="288" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="500" fill="#fff" text-anchor="middle">78</text>
  </g>

  <!-- Caliper side panel -->
  <g filter="url(#panelShadow)">
    <rect x="540" y="50" width="240" height="430" fill="#1c1c1e" fill-opacity="0.96" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10"/>
  </g>

  <!-- Panel header -->
  <rect x="540" y="50" width="240" height="38" fill="rgba(255,255,255,0.02)" rx="10"/>
  <rect x="540" y="78" width="240" height="10" fill="rgba(255,255,255,0.02)"/>
  <line x1="540" y1="88" x2="780" y2="88" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="556" y="74" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="rgba(255,255,255,0.85)">div.card › button[data-testid=&quot;cta&quot;]</text>
  <g transform="translate(750, 60)">
    <rect width="20" height="20" fill="none"/>
    <path d="M5 5 L15 15 M15 5 L5 15" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Section: LAYOUT -->
  <text x="556" y="112" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.42)" letter-spacing="0.08em">LAYOUT</text>

  <text x="556" y="132" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">W</text>
  <text x="764" y="132" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">140px</text>

  <text x="556" y="150" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">H</text>
  <text x="764" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">36px</text>

  <text x="556" y="168" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">X</text>
  <text x="764" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">80px</text>

  <text x="556" y="186" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Y</text>
  <text x="764" y="186" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">276px</text>

  <text x="556" y="204" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Display</text>
  <text x="764" y="204" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">flex</text>

  <line x1="540" y1="220" x2="780" y2="220" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Section: SPACING -->
  <text x="556" y="238" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.42)" letter-spacing="0.08em">SPACING</text>

  <text x="556" y="258" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Padding</text>
  <text x="764" y="258" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">8 16px</text>

  <line x1="540" y1="274" x2="780" y2="274" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Section: TYPOGRAPHY -->
  <text x="556" y="292" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.42)" letter-spacing="0.08em">TYPOGRAPHY</text>

  <text x="556" y="312" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Font</text>
  <text x="764" y="312" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">Inter</text>

  <text x="556" y="330" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Size</text>
  <text x="764" y="330" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">11px</text>

  <text x="556" y="348" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Weight</text>
  <text x="764" y="348" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">Semi Bold 600</text>

  <text x="556" y="366" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Color</text>
  <rect x="734" y="358" width="11" height="11" fill="#fff" stroke="rgba(255,255,255,0.16)" stroke-width="1" rx="2"/>
  <text x="730" y="366" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">#FFFFFF</text>

  <line x1="540" y1="382" x2="780" y2="382" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Section: FILL -->
  <text x="556" y="400" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.42)" letter-spacing="0.08em">FILL</text>

  <text x="556" y="420" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.55)">Fill</text>
  <rect x="722" y="412" width="11" height="11" fill="#0d99ff" stroke="rgba(255,255,255,0.16)" stroke-width="1" rx="2"/>
  <text x="718" y="420" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#fff" text-anchor="end">#0D99FF</text>

  <!-- Footer -->
  <line x1="540" y1="450" x2="780" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="556" y="468" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.42)">Hover any element · distance</text>
  <text x="700" y="468" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.42)">Esc · deselect</text>
</svg>
