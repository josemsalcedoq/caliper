<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Caliper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
        <rect x="2.5" y="2.5" width="15" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="0.75" y="0.75" width="3.5" height="3.5" rx="0.5" fill="currentColor"/>
        <rect x="15.75" y="0.75" width="3.5" height="3.5" rx="0.5" fill="currentColor"/>
        <rect x="0.75" y="15.75" width="3.5" height="3.5" rx="0.5" fill="currentColor"/>
        <rect x="15.75" y="15.75" width="3.5" height="3.5" rx="0.5" fill="currentColor"/>
      </svg>
    </span>
    <span class="name">Caliper</span>
    <span class="version" id="version">v—</span>
  </div>
  <p class="tagline">Inspect any UI like Figma. Measure, align, ship pixel-perfect.</p>

  <button id="toggle" class="toggle" type="button">
    <span class="dot" aria-hidden="true"></span>
    <span class="label">Activate inspector</span>
    <span class="kbd" id="kbd"></span>
  </button>

  <div id="status-msg" class="status-msg" hidden></div>

  <div class="legend">
    <div class="legend-row"><kbd>Hover</kbd><span>measure any element</span></div>
    <div class="legend-row"><kbd>Click</kbd><span>lock selection &amp; inspect</span></div>
    <div class="legend-row"><kbd>Drag</kbd><span>free ruler between two points</span></div>
    <div class="legend-row"><kbd>Move</kbd><span>distance from your selection</span></div>
    <div class="legend-row"><kbd>Esc</kbd><span>clear / deselect / exit</span></div>
  </div>

  <section class="viewport" id="viewport-section">
    <div class="section-title">Responsive viewport</div>
    <div class="presets">
      <button class="preset" data-w="375" data-h="667" data-mobile="true" type="button">
        <span class="preset-w">375</span><span class="preset-label">Mobile</span>
      </button>
      <button class="preset" data-w="768" data-h="1024" data-mobile="true" type="button">
        <span class="preset-w">768</span><span class="preset-label">Tablet</span>
      </button>
      <button class="preset" data-w="1440" data-h="900" type="button">
        <span class="preset-w">1440</span><span class="preset-label">Desktop</span>
      </button>
      <button class="preset" data-action="reset" type="button">
        <span class="preset-w">×</span><span class="preset-label">Off</span>
      </button>
    </div>
    <div class="custom-row">
      <input type="number" id="custom-w" min="50" max="4000" placeholder="W" inputmode="numeric">
      <span class="x">×</span>
      <input type="number" id="custom-h" min="50" max="4000" placeholder="H" inputmode="numeric">
      <button id="apply-custom" type="button">Apply</button>
    </div>
    <div class="aux-row">
      <button id="rotate" class="aux-btn" type="button" title="Swap width and height">
        <svg viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 7a5 5 0 0 1 9.5-2.2"/>
          <path d="M11.5 2v3h-3"/>
          <path d="M12 7a5 5 0 0 1-9.5 2.2"/>
          <path d="M2.5 12V9h3"/>
        </svg>
        Rotate
      </button>
      <div class="dpr-group" role="group" aria-label="Device pixel ratio">
        <span class="dpr-label">DPR</span>
        <button class="dpr" data-dpr="1" type="button">1×</button>
        <button class="dpr" data-dpr="2" type="button">2×</button>
        <button class="dpr" data-dpr="3" type="button">3×</button>
      </div>
    </div>
    <div class="current-size" id="current-size">—</div>
  </section>

  <a id="shortcut-link" class="link" href="#">Customize keyboard shortcut →</a>

  <script src="popup.js"></script>
</body>
</html>
